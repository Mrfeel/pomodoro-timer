<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐剧服装贴纸书 · 人物连线</title>
<style>
  :root {
    --bg: #f5f0e8;
    --paper: #fffaf0;
    --sticker: #fffdf7;
    --char: #eef4ff;
    --border: #d4c9b8;
    --accent: #c0392b;
    --gold: #d4a017;
    --correct: #27ae60;
    --wrong: #e74c3c;
    --shadow: 0 4px 16px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: #3d3226;
    min-height: 100vh;
    padding: 24px;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 2rem;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  header p {
    color: #7a6e5d;
    font-size: 0.95rem;
  }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 22px;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
  }

  .btn-check {
    background: var(--accent);
    color: #fff;
  }
  .btn-check:hover { background: #a93226; transform: translateY(-1px); }

  .btn-reset {
    background: #fff;
    color: var(--accent);
    border: 2px solid var(--accent);
  }
  .btn-reset:hover { background: #fdf2f0; }

  .btn-shuffle {
    background: var(--gold);
    color: #fff;
  }
  .btn-shuffle:hover { background: #b8860b; }

  .container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    body { padding: 12px; }
    .panel { padding: 12px; }
    .sticker-sheet { grid-template-columns: 1fr; }
    .sticker { padding: 12px 14px; }
    .sticker .costume { font-size: 0.88rem; }
    .char-slot { padding: 12px 14px; }
    .char-slot .name { font-size: 0.92rem; }
    header h1 { font-size: 1.5rem; }
    header p { font-size: 0.82rem; }
  }

  .panel {
    background: var(--paper);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .panel h2 {
    font-size: 1.25rem;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px dashed var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel h2 .icon { font-size: 1.4rem; }

  /* 贴纸卡片 */
  .sticker-sheet {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }

  .sticker {
    background: var(--sticker);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: grab;
    transition: all 0.18s;
    position: relative;
    box-shadow: 2px 3px 0 rgba(0,0,0,0.06);
    user-select: none;
  }
  .sticker:hover {
    transform: rotate(-1.5deg) scale(1.02);
    box-shadow: 4px 5px 0 rgba(0,0,0,0.1);
    border-color: var(--gold);
  }
  .sticker:active { cursor: grabbing; }
  .sticker .costume {
    font-size: 0.92rem;
    color: #4a3f30;
  }
  .sticker .hint {
    font-size: 0.75rem;
    color: #9a8c7a;
    margin-top: 6px;
    font-style: italic;
  }

  /* 人物槽 */
  .char-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .char-slot {
    background: var(--char);
    border: 2px dashed #b8c8e8;
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.2s;
    min-height: 60px;
  }

  .char-slot .num {
    font-weight: 700;
    color: var(--accent);
    font-size: 1.1rem;
    width: 28px;
    text-align: center;
    flex-shrink: 0;
  }

  .char-slot .name {
    font-weight: 600;
    font-size: 1rem;
    color: #2c3e50;
    flex: 1;
  }

  .char-slot .source {
    font-size: 0.72rem;
    color: #8a9bb5;
    background: #e8eef7;
    padding: 2px 8px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .char-slot .placed {
    font-size: 0.82rem;
    color: #6a5a48;
    font-style: italic;
    flex: 1;
  }

  /* 拖拽状态 */
  .sticker.dragging {
    opacity: 0.4;
    transform: rotate(3deg) scale(1.03);
  }

  .char-slot.drag-over {
    background: #d4e4ff;
    border-color: var(--gold);
    border-style: solid;
    transform: scale(1.01);
  }

  .char-slot.correct {
    background: #d5f5e3;
    border-color: var(--correct);
    border-style: solid;
  }

  .char-slot.correct .name { color: var(--correct); }

  .char-slot.wrong {
    background: #fadbd8;
    border-color: var(--wrong);
    border-style: solid;
  }

  .char-slot.wrong .name { color: var(--wrong); }

  .sticker.matched {
    opacity: 0.5;
    border-style: dashed;
    border-color: #ccc;
    cursor: default;
  }

  .sticker.selected {
    border-color: var(--gold);
    border-width: 3px;
    box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.25);
    transform: scale(1.03);
  }

  /* 结果区 */
  .result {
    text-align: center;
    margin-top: 24px;
    font-size: 1.1rem;
    min-height: 28px;
    font-weight: 600;
  }

  .result.success { color: var(--correct); }
  .result.error { color: var(--wrong); }

  footer {
    text-align: center;
    margin-top: 32px;
    color: #a09080;
    font-size: 0.8rem;
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 16px;
    font-size: 0.82rem;
    color: #7a6e5d;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.green { background: var(--correct); }
  .dot.red { background: var(--wrong); }
  .dot.gold { background: var(--gold); }
</style>
</head>
<body>

<header>
  <h1>🎭 音乐剧服装贴纸书</h1>
  <p>桌面端：把左边的「服装贴纸」拖到右边对应的人物槽里<br>手机端：先点选贴纸，再点击人物槽完成连线</p>
</header>

<div class="legend">
  <span><i class="dot gold"></i>点选/拖拽贴纸</span>
  <span><i class="dot green"></i>匹配正确</span>
  <span><i class="dot red"></i>匹配错误</span>
</div>

<div class="toolbar">
  <button class="btn-shuffle" onclick="shuffleStickers()">🔀 随机打乱</button>
  <button class="btn-check" onclick="checkAll()">✅ 检查答案</button>
  <button class="btn-reset" onclick="resetAll()">↺ 重置</button>
</div>

<div class="container">
  <!-- 左：贴纸面板 -->
  <div class="panel">
    <h2><span class="icon">✂️</span>服装贴纸册</h2>
    <div class="sticker-sheet" id="stickerSheet"></div>
  </div>

  <!-- 右：人物面板 -->
  <div class="panel">
    <h2><span class="icon">👤</span>人物档案卡</h2>
    <div class="char-list" id="charList"></div>
  </div>
</div>

<div class="result" id="result"></div>

<footer>
  素材来源：经典百老汇/西区音乐剧剧照 · 仅用于活动体验
</footer>

<script>
  // ===== 数据 =====
  // 每个贴纸: { id, costume, hint, source, answer }
  // 每个人物: { id, name, source }
  const STICKERS = [
    { id: 's1', costume: '黑色斗篷、白色半脸面具、白衬衫、黑领结，手执红玫瑰', hint: '半脸面具是最大特征', source: '歌剧魅影', answer: 'phantom' },
    { id: 's2', costume: '白色芭蕾舞裙、蓝色丝带、金色长发、粉色丝带', hint: '芭蕾舞裙+丝带', source: '歌剧魅影', answer: 'christine' },
    { id: 's3', costume: '棕色呢子大衣、高顶礼帽、外套上别着一枚红缎带', hint: '红缎带是标志', source: '悲惨世界', answer: 'valjean' },
    { id: 's4', costume: '白色内衬长裙、蓝色披肩、红色头发，后期衣衫凌乱', hint: '红发+蓝披肩', source: '悲惨世界', answer: 'fantine' },
    { id: 's5', costume: '蓝色优雅长裙、白色裙摆缀满花朵、珍珠项链', hint: '白裙+花朵', source: '悲惨世界', answer: 'cosette' },
    { id: 's6', costume: '深蓝色外套、白色衬衫、及膝马裤、棕色假发', hint: '及膝马裤+假发', source: '汉密尔顿', answer: 'hamilton' },
    { id: 's7', costume: '亮黄色大摆长裙、白色手套、珍珠项链', hint: '黄色长裙', source: '美女与野兽', answer: 'belle' },
    { id: 's8', costume: '黑色长裙、黑色斗篷、绿色皮肤、手握扫帚', hint: '绿皮肤+扫帚', source: '魔法坏女巫', answer: 'elphaba' },
    { id: 's9', costume: '粉色泡泡裙、银色魔杖、水晶皇冠、粉色高跟鞋', hint: '粉色泡泡裙', source: '魔法坏女巫', answer: 'glinda' },
    { id: 's10', costume: '黑色大衣、红色蝴蝶结、黑色高顶帽、手持鹦鹉伞', hint: '红蝴蝶结+鹦鹉伞', source: '欢乐满人间', answer: 'marypoppins' },
    { id: 's11', costume: '黑色亮片紧身裙、羽毛头饰、红色唇妆、吊带袜', hint: '亮片+羽毛头饰', source: '芝加哥', answer: 'roxie' },
    { id: 's12', costume: '蓝色POLO衫、牛仔夹克、手臂上戴着石膏护臂', hint: '石膏护臂是关键', source: '致埃文·汉森', answer: 'evan' },
    { id: 's13', costume: '金色狮子鬃毛头套、棕色/金色身体装', hint: '狮子鬃毛', source: '狮子王', answer: 'simba' },
    { id: 's14', costume: '紫色马甲、蓝色灯笼裤、红色头巾、棕色靴子', hint: '紫马甲+红头巾', source: '阿拉丁', answer: 'aladdin' },
    { id: 's15', costume: '红色鸭舌帽、破旧呢子大衣、肩挎吉他', hint: '红帽+吉他', source: '冥界', answer: 'orpheus' },
    { id: 's16', costume: '绿色连衣裙、金色腰带、深色卷发', hint: '绿裙+金腰带', source: '冥界', answer: 'euridice' },
  ];

  const CHARACTERS = [
    { id: 'phantom', name: '魅影 Phantom', source: '《歌剧魅影》' },
    { id: 'christine', name: '克里斯汀 Christine', source: '《歌剧魅影》' },
    { id: 'valjean', name: '冉阿让 Jean Valjean', source: '《悲惨世界》' },
    { id: 'fantine', name: '芳汀 Fantine', source: '《悲惨世界》' },
    { id: 'cosette', name: '珂赛特 Cosette', source: '《悲惨世界》' },
    { id: 'hamilton', name: '亚历山大·汉密尔顿', source: '《汉密尔顿》' },
    { id: 'belle', name: '贝儿 Belle', source: '《美女与野兽》' },
    { id: 'elphaba', name: '艾芙芭 Elphaba', source: '《魔法坏女巫》' },
    { id: 'glinda', name: '葛琳达 Glinda', source: '《魔法坏女巫》' },
    { id: 'marypoppins', name: '玛丽·波平斯', source: '《欢乐满人间》' },
    { id: 'roxie', name: '罗克西 Roxie', source: '《芝加哥》' },
    { id: 'evan', name: '埃文·汉森 Evan', source: '《致埃文·汉森》' },
    { id: 'simba', name: '辛巴 Simba', source: '《狮子王》' },
    { id: 'aladdin', name: '阿拉丁 Aladdin', source: '《阿拉丁》' },
    { id: 'orpheus', name: '奥菲斯 Orpheus', source: '《冥界》' },
    { id: 'euridice', name: '欧律狄刻 Eurydice', source: '《冥界》' },
  ];

  // ===== 状态 =====
  let stickerOrder = [...STICKERS];
  let assignments = {}; // stickerId -> characterId
  let matchedStickers = new Set();

  // ===== 渲染 =====
  function renderStickers() {
    const sheet = document.getElementById('stickerSheet');
    sheet.innerHTML = '';
    stickerOrder.forEach(s => {
      const el = document.createElement('div');
      el.className = 'sticker' + (matchedStickers.has(s.id) ? ' matched' : '');
      el.draggable = !matchedStickers.has(s.id);
      el.dataset.id = s.id;
      el.innerHTML =
        '<div class="costume">' + s.costume + '</div>' +
        '<div class="hint">💡 ' + s.hint + '</div>';
      el.addEventListener('dragstart', onDragStart);
      el.addEventListener('click', onStickerTap);
      sheet.appendChild(el);
    });
  }

  function renderChars() {
    const list = document.getElementById('charList');
    list.innerHTML = '';
    CHARACTERS.forEach(c => {
      const el = document.createElement('div');
      el.className = 'char-slot';
      el.dataset.id = c.id;
      el.innerHTML =
        '<span class="num">#</span>' +
        '<span class="name">' + c.name + '</span>' +
        '<span class="source">' + c.source + '</span>' +
        '<span class="placed"></span>';
      el.addEventListener('dragover', onDragOver);
      el.addEventListener('dragleave', onDragLeave);
      el.addEventListener('drop', onDrop);
      el.addEventListener('click', onCharTap);
      list.appendChild(el);
    });
    updateCharPlaced();
  }

  function updateCharPlaced() {
    CHARACTERS.forEach(c => {
      const slot = document.querySelector('.char-slot[data-id="' + c.id + '"]');
      const placed = slot.querySelector('.placed');
      const assigned = Object.keys(assignments).filter(k => assignments[k] === c.id);
      if (assigned.length > 0) {
        const st = STICKERS.find(s => s.id === assigned[0]);
        placed.textContent = '← ' + st.costume.substring(0, 28) + '…';
      } else {
        placed.textContent = '点选贴纸…';
      }
    });
  }

  // ===== 拖拽（桌面端）+ 点选（移动端） =====
  let draggedId = null;
  let selectedStickerId = null; // 移动端点选状态

  function onDragStart(e) {
    draggedId = e.currentTarget.dataset.id;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedId);
  }

  function onDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
  }

  function onDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
  }

  function onDrop(e) {
    e.preventDefault();
    const charId = e.currentTarget.dataset.id;
    e.currentTarget.classList.remove('drag-over');

    if (draggedId === null) return;

    placeSticker(draggedId, charId);
    draggedId = null;
  }

  // 移动端：点击贴纸 = 选中
  function onStickerTap(e) {
    const id = e.currentTarget.dataset.id;
    if (matchedStickers.has(id)) return;

    // 取消之前选中的
    document.querySelectorAll('.sticker.selected').forEach(el => el.classList.remove('selected'));
    selectedStickerId = id;
    e.currentTarget.classList.add('selected');
  }

  // 移动端：点击人物槽 = 放置选中的贴纸
  function onCharTap(e) {
    if (selectedStickerId === null) return;
    const charId = e.currentTarget.dataset.id;
    placeSticker(selectedStickerId, charId);
    selectedStickerId = null;
    document.querySelectorAll('.sticker.selected').forEach(el => el.classList.remove('selected'));
  }

  // 核心：把贴纸放入槽位
  function placeSticker(stickerId, charId) {
    const slot = document.querySelector('.char-slot[data-id="' + charId + '"]');
    if (!slot) return;

    // 若目标槽已有别的贴纸，先释放它
    const prevStickerInSlot = Object.keys(assignments).find(k => assignments[k] === charId);
    if (prevStickerInSlot && prevStickerInSlot !== stickerId) {
      const prevEl = document.querySelector('.sticker[data-id="' + prevStickerInSlot + '"]');
      if (prevEl) {
        prevEl.classList.remove('matched');
        prevEl.draggable = true;
      }
      delete assignments[prevStickerInSlot];
      matchedStickers.delete(prevStickerInSlot);
    }

    // 移除该贴纸之前的分配
    const prevChar = assignments[stickerId];
    if (prevChar) {
      const prevSlot = document.querySelector('.char-slot[data-id="' + prevChar + '"]');
      if (prevSlot) prevSlot.classList.remove('correct', 'wrong');
    }

    assignments[stickerId] = charId;
    matchedStickers.add(stickerId);

    // 高亮该槽
    const sticker = STICKERS.find(s => s.id === stickerId);
    const isCorrect = sticker.answer === charId;
    slot.classList.add(isCorrect ? 'correct' : 'wrong');

    // 贴纸变灰
    const stickerEl = document.querySelector('.sticker[data-id="' + stickerId + '"]');
    if (stickerEl) {
      stickerEl.classList.add('matched');
      stickerEl.draggable = false;
    }

    updateCharPlaced();
  }

  // ===== 提醒节点 =====
  let milestonesShown = new Set();

  function checkMilestones(correct) {
    const msgs = {
      5: '🌟 达成 5 连胜！手感越来越好了！',
      10: '🏆 十连对！你是音乐剧服装达人吗？',
      16: '👑 满分通关！全部 16 个角色都认出来了！'
    };
    // 按正确数从高到低检查，避免跳级漏报
    [16, 10, 5].forEach(n => {
      if (correct >= n && !milestonesShown.has(n)) {
        milestonesShown.add(n);
        const result = document.getElementById('result');
        result.textContent = msgs[n];
        result.className = 'result success';
      }
    });
  }

  // ===== 操作 =====
  function shuffleStickers() {
    // 重置
    assignments = {};
    matchedStickers = new Set();
    milestonesShown = new Set();
    document.querySelectorAll('.char-slot').forEach(s => s.classList.remove('correct', 'wrong', 'drag-over'));
    // Fisher-Yates 打乱
    const arr = [...STICKERS];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    stickerOrder = arr;
    document.getElementById('result').textContent = '';
    document.getElementById('result').className = 'result';
    renderStickers();
    renderChars();
  }

  function checkAll() {
    const total = CHARACTERS.length;
    let correct = 0;
    CHARACTERS.forEach(c => {
      const slot = document.querySelector('.char-slot[data-id="' + c.id + '"]');
      const assigned = Object.keys(assignments).filter(k => assignments[k] === c.id);
      if (assigned.length === 0) {
        slot.classList.remove('correct', 'wrong');
      } else {
        const sticker = STICKERS.find(s => s.id === assigned[0]);
        if (sticker.answer === c.id) {
          slot.classList.add('correct');
          slot.classList.remove('wrong');
          correct++;
        } else {
          slot.classList.add('wrong');
          slot.classList.remove('correct');
        }
      }
    });

    const result = document.getElementById('result');
    if (correct === total) {
      result.textContent = '🎉 全部正确！太棒了！';
      result.className = 'result success';
    } else if (correct === 0) {
      result.textContent = '还没开始匹配哦～';
      result.className = 'result error';
    } else {
      result.textContent = '⭐ 得分：' + correct + ' / ' + total + ' · 继续加油！';
      result.className = 'result error';
    }

    // 提醒节点：5 / 10 / 16 连胜
    checkMilestones(correct);
  }

  function resetAll() {
    assignments = {};
    matchedStickers = new Set();
    milestonesShown = new Set();
    document.querySelectorAll('.char-slot').forEach(s => s.classList.remove('correct', 'wrong', 'drag-over'));
    stickerOrder = [...STICKERS];
    document.getElementById('result').textContent = '';
    document.getElementById('result').className = 'result';
    renderStickers();
    renderChars();
  }

  // ===== 初始化 =====
  renderStickers();
  renderChars();
</script>
</body>
</html>
